<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>FlashRank App laden</title>
    <meta property="og:title" content="FlashRank App laden">
    <meta property="og:description" content="Hier geht es direkt zum Download für iOS und Android.">
    <meta property="og:image" content="https://jklife78.github.io/flashrank-privacy/bild.jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jklife78.github.io/flashrank-privacy/app.html">
    
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .loading-text {
            color: #8b949e;
            font-size: 16px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
            margin-bottom: 20px;
        }

        /* Der Fallback-Button, falls die Automatik auf dem Tablet blockiert */
        .store-button {
            display: inline-block;
            background-color: #1f8a3a;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(31, 138, 58, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .store-button:active {
            transform: scale(0.98);
            background-color: #1a7531;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Bild.jpg" alt="FlashRank Preview" class="banner-img">
        
        <div class="loading-text">
            <p>Verbindung zum Store wird hergestellt...</p>
        </div>

        <a id="fallback-btn" href="https://jklife78.github.io/flashrank-privacy/support.html" class="store-button">
            Direkt zum Store wechseln
        </a>
    </div>

    <script>
        (function() {
            var userAgent = (navigator.userAgent || navigator.vendor || window.opera).toLowerCase();
            
            // Die Links sauber definieren
            var iosLink = "https://apps.apple.com/us/app/flashrank/id6761028403";
            var androidLink = "intent://details?id=de.komsthoeft.flashrank#Intent;scheme=market;package=com.android.vending;end";
            var fallbackLink = "https://jklife78.github.io/flashrank-privacy/support.html";
            
            var targetLink = fallbackLink;

            // Erkennung logisch aufschlüsseln
            var isIOS = /ipad|iphone|ipod/.test(userAgent) && !window.MSStream;
            var isAndroid = /android/.test(userAgent);
            
            // Tablet-Spezialfall: Erkennt iPads und Android-Tablets im Desktop-Modus (maxTouchPoints)
            var isTabletDesktopMode = (navigator.maxTouchPoints && navigator.maxTouchPoints > 1 && (/macintosh/.test(userAgent) || /linux/.test(userAgent)));

            if (isIOS) {
                targetLink = iosLink;
            } else if (isAndroid) {
                targetLink = androidLink;
            } else if (isTabletDesktopMode) {
                // Wenn wir Touchpunkte auf Linux haben, ist es sehr wahrscheinlich ein Android-Tablet im PC-Modus
                if (/linux/.test(userAgent)) {
                    targetLink = androidLink;
                } else {
                    targetLink = iosLink;
                }
            }

            // 1. Button dynamisch an das erkannte Gerät anpassen
            document.getElementById('fallback-btn').href = targetLink;

            // 2. Sofortige automatische Weiterleitung versuchen
            if (targetLink !== fallbackLink) {
                window.location.href = targetLink;
            }
        })();
    </script>

</body>
</html>

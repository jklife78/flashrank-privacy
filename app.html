<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Der Titel und die Beschreibung für die Link-Vorschau -->
    <title>FlashRank App laden</title>
    <meta property="og:title" content="FlashRank App laden">
    <meta property="og:description" content="Hier geht es direkt zum Download für iOS und Android.">

    <!-- Das Bild, das Instagram/Social Media als Vorschau zieht -->
    <meta property="og:image" content="https://jklife78.github.io/flashrank-privacy/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Kleines Icon oben im Browser-Tab -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* Schickes Dunkelgrau/Schwarz */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        p {
            color: #8b949e;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #30363d;
            transition: background-color 0.2s, border-color 0.2s;
        }

        /* Apple Button Styling */
        .btn-apple {
            background-color: #ffffff;
            color: #000000;
            border: none;
        }

        /* Android Button Styling */
        .btn-android {
            background-color: #2ea44f;
            color: #ffffff;
            border: none;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dein Logo wird hier direkt geladen -->
        <img src="WhatsApp Image 2026-03-23 at 20.51.54.jpg" alt="FlashRank Logo" class="logo">
        
        <h1>FlashRank</h1>
        <p>Wähle deinen Store, um die App zu installieren:</p>

        <!-- Der Apple Button -->
        <a href="https://apps.apple.com/us/app/flashrank/id6761028403" class="btn btn-apple">
             Im App Store laden
        </a>

<!-- Der Android Button mit speziellem WhatsApp/In-App-Browser-Bypass -->
<a href="intent://play.google.com/store/apps/details?id=de.komsthoeft.flashrank#Intent;scheme=https;package=com.android.vending;end" class="btn btn-android">
    ▶ Bei Google Play laden
</a>
    </div>

</body>
</html>

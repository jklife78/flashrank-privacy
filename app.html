<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Der Titel und die Beschreibung für die Link-Vorschau -->
    <title>FlashRank App laden</title>
    <meta property="og:title" content="FlashRank App laden">
    <meta property="og:description" content="Hier geht es direkt zum Download für iOS und Android.">

    <!-- Das Bild, das in WhatsApp/Social Media als Vorschau zieht -->
    <meta property="og:image" content="https://jklife78.github.io/flashrank-privacy/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Kleines Icon oben im Browser-Tab -->
    <link rel="icon" type="image/png" href="logo.png">

    <script>
        (function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // 1. Wenn es ein iPhone/iPad ist -> Sofort zum Apple App Store
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = "https://apps.apple.com/us/app/flashrank/id6761028403";
            } 
            // 2. Wenn es ein Android-Gerät ist -> WhatsApp-Bypass direkt in die Play Store App zwingen
            else if (/android/i.test(userAgent)) {
                window.location.href = "intent://play.google.com/store/apps/details?id=de.komsthoeft.flashrank#Intent;scheme=https;package=com.android.vending;end";
            } 
            // 3. PC/Mac oder unbekannt -> Fallback auf deine Support-Website
            else {
                window.location.href = "https://jklife78.github.io/flashrank-privacy/support.html";
            }
        })();
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 500px; /* Etwas breiter für das Querformat-Bild */
            width: 100%;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover; /* Verhindert, dass das Bild verzerrt wird */
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .loading-text {
            color: #8b949e;
            font-size: 16px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* Kleiner visueller Effekt für den Ladetext */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dein breites Bild im Querformat -->
        <img src="Bild.jpg" alt="FlashRank Preview" class="banner-img">
        
        <!-- Der Ladetext unter dem Bild -->
        <div class="loading-text">
            <p>Verbindung zum Store wird hergestellt...</p>
        </div>
    </div>

</body>
</html>
